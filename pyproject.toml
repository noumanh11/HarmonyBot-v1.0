[project]
name = "harmonybot"
version = "2.1.0"
description = "A retrieval-grounded medical and mental-health conversational assistant."
readme = "README.md"
# numpy 2.5 dropped 3.11, so 3.12 is the real floor for this dependency set.
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Shabi ul Hassan" },
    { name = "Abdullah Salman" },
    { name = "Nouman Hafeez" },
]

# Verified working together on Python 3.13 - the whole test suite passes on
# these floors, including the numpy 2.x / datasets 5.x / starlette 1.x majors.
dependencies = [
    "fastapi>=0.141,<1.0",
    "uvicorn[standard]>=0.52,<1.0",
    "jinja2>=3.1,<4.0",
    "pydantic>=2.13,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "huggingface-hub>=1.27,<2.0",
    "datasets>=5.0,<6.0",
    "scikit-learn>=1.9,<2.0",
    "numpy>=2.5,<3.0",
    "markdown2>=2.5,<3.0",
    "bleach>=6.4,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.13",
]

[project.urls]
Repository = "https://github.com/noumanh11/HarmonyBot-v1.0"
Upstream = "https://github.com/shabihassan1/HarmonyBot-v1.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# Ruff replaces black + isort + flake8 + pyupgrade with one fast binary.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 90
target-version = "py312"
extend-exclude = ["static", "templates"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "SIM",       # simplify
    "RUF",       # ruff-specific
    "ASYNC",     # async correctness
    "S",         # bandit security
    "PTH",       # prefer pathlib
    "T20",       # no stray print()
]
ignore = [
    "S104",  # binding 0.0.0.0 is intentional inside a container
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert is the point of a test

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::PendingDeprecationWarning",
    "ignore::DeprecationWarning:starlette.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["*/tests/*"]

# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
disallow_untyped_defs = false   # tighten module by module
ignore_missing_imports = true   # datasets / markdown2 ship no stubs
